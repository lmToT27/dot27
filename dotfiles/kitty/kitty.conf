font_family      JetBrainsMono Nerd Font
font_size        19.0

# Written by changetheme.sh (mode-aware) from themes/tokyonight-{dark,light}.conf.
include ~/.cache/theme/kitty-colors.conf
# Per-process socket, not a shared fixed path — a fixed path can only be
# bound by the first kitty process, so every other open window would
# silently fail to be reachable for live theme reload.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

cursor_shape beam
cursor_blink_interval 1
cursor_trail 2
cursor_trail_decay 0.1 0.4

window_padding_width 4
confirm_os_window_close 0
