# vim:ft=kitty

## name: Tokyo Night Day
## license: MIT
## author: Folke Lemaitre
## upstream: https://github.com/folke/tokyonight.nvim/raw/main/extras/kitty/tokyonight_day.conf


# background/cursor_text_color patched to true white (not Tokyo Night
# Day's stock #e1e2e7) to match this shell's white light mode elsewhere.
background #ffffff
foreground #3a3a3a
selection_background #e6e6e6
selection_foreground #3a3a3a
url_color #387068
cursor #3a3a3a
cursor_text_color #ffffff

# Tabs
active_tab_background #3a3a3a
active_tab_foreground #ffffff
inactive_tab_background #c4c8da
inactive_tab_foreground #8990b3
#tab_bar_background #b4b5b9

# Windows
active_border_color #3a3a3a
inactive_border_color #c4c8da

# normal — darkened (hue-preserved, HSL lightness capped ~0.38) off Tokyo
# Night Day's stock values, which read too light/washed-out on pure white
# (e.g. bold-blue directory listings via LS_COLORS).
color0 #5e5f64
color1 #b9093c
color2 #587539
color3 #86683b
color4 #1255af
color5 #560fb3
color6 #007197
color7 #414f81

# bright
color8  #4a5078
color9  #c2002f
color10 #5c8524
color11 #9b7127
color12 #0052c2
color13 #5100c2
color14 #007ea8
color15 #3a3a3a

# extended colors
color16 #b15c00
color17 #c64343
