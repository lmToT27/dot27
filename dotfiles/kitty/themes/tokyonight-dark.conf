# background/cursor_text_color patched to true black (not Tokyo Night's
# stock #1a1b26) to match this shell's near-black dark mode elsewhere.
background #000000
foreground #d4d4d4
selection_background #3a3a3a
selection_foreground #d4d4d4
url_color #73daca
cursor #d4d4d4
cursor_text_color #000000

# Tabs
active_tab_background #d4d4d4
active_tab_foreground #000000
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
#tab_bar_background #15161e

# Windows
active_border_color #d4d4d4
inactive_border_color #292e42

# normal
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
