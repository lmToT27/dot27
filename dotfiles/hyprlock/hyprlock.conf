source = ~/.cache/theme/hyprlock-colors.conf

background {
    monitor =
    path = ~/.cache/theme/blurred_wallpaper.jpg
    color = $bg_color
    blur_passes = 0
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    capslock_color = $accent
    inner_color = $bg_color
    font_color = $text_color
    fade_on_empty = false
    placeholder_text = <i><span foreground="##ffffff99">󰌾  Password...</span></i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_size = 100
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B, %Y"
    color = $accent
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/hyprlock-media.sh
    color = $accent
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 90
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰒮
    color = $accent
    font_size = 24
    font_family = JetBrainsMono Nerd Font Bold
    position = -60, 50
    halign = center
    valign = bottom
    onclick = ~/.local/bin/hyprlock-player-ctl.sh previous
}

label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/hyprlock-playpause-icon.sh
    color = $accent
    font_size = 24
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 50
    halign = center
    valign = bottom
    onclick = ~/.local/bin/hyprlock-player-ctl.sh play-pause
}

label {
    monitor =
    text = 󰒭
    color = $accent
    font_size = 24
    font_family = JetBrainsMono Nerd Font Bold
    position = 60, 50
    halign = center
    valign = bottom
    onclick = ~/.local/bin/hyprlock-player-ctl.sh next
}
